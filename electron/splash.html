<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starting BG AI Desktop...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px;
      max-width: 440px;
    }
    .logo-container {
      margin-bottom: 24px;
      position: relative;
    }
    .brand-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .brand-accent {
      color: #7c6bff;
    }
    .subtitle {
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 32px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .status-text {
      font-size: 14px;
      color: #d4d4d8;
      margin-bottom: 16px;
      min-height: 20px;
    }
    .progress-bar-container {
      width: 280px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c6bff, #60a5fa);
      width: 30%;
      border-radius: 999px;
      animation: indeterminate 1.5s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% {
        transform: translateX(-100%);
        width: 30%;
      }
      50% {
        width: 60%;
      }
      100% {
        transform: translateX(350%);
        width: 30%;
      }
    }
    .error-container {
      display: none;
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      font-size: 13px;
      text-align: left;
      width: 100%;
      -webkit-app-region: no-drag;
    }
    .action-btn {
      margin-top: 16px;
      padding: 8px 16px;
      border-radius: 6px;
      background: #7c6bff;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      -webkit-app-region: no-drag;
    }
    .action-btn:hover {
      background: #6d5ce6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <h1 class="brand-title"><span class="brand-accent">BG</span> AI</h1>
      <p class="subtitle">Desktop Intelligence Platform</p>
    </div>

    <div id="statusText" class="status-text">Starting backend engine...</div>

    <div class="progress-bar-container" id="progressContainer">
      <div class="progress-bar-fill"></div>
    </div>

    <div id="errorContainer" class="error-container">
      <div id="errorMessage">Startup timed out.</div>
      <button class="action-btn" onclick="retry()">Retry</button>
    </div>
  </div>

  <script>
    function updateStatus(text) {
      document.getElementById('statusText').innerText = text;
    }
    function showError(msg) {
      document.getElementById('progressContainer').style.display = 'none';
      document.getElementById('errorContainer').style.display = 'block';
      document.getElementById('errorMessage').innerText = msg;
    }
    function retry() {
      window.location.reload();
    }
  </script>
</body>
</html>
